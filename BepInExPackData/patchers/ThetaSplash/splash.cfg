# This is the configuration file for the splash screen.
# You can change the values below to customize the splash screen.
# For custom image paths, use the `assets` folder in the splash screen's directory.
# --------

# Set this to your project's name. ex: "MyMod"
ProjectName=Town of Us: Mira
# Set this to the name of the game which this splash screen is for. ex: "Among Us"
# This is used in the loading text on the splash screen.
GameName=Among Us
# Set this to your project's discord link. ex: "https://discord.gg/example"
DiscordLink=https://discord.gg/town-of-us
# Set this to your project's Website/GitHub link. ex: "https://github.com/example"
GitHubLink=https://github.com/AU-Avengers/TOU-Mira
# Set this to the path of your project's logo. ex: "logo.png"
# Highly recommended to put this in the assets folder.
# This is the logo which will appear on the splash screen. Recommended to use a transparent image or else it'll look weird.
LogoPath=assets/SplashBanner.png
# Set this to the path of your project's icon. ex: "icon.png"
# Highly recommended to put this in the assets folder.
# This is the icon which will appear in the taskbar.
IconPath=assets/SplashIcon.png
